; jevban: copy to /etc/jevban/jevban.ini (or next to the binary)

[jevban]
; access logs to follow; comma separated, wildcards allowed in the file name
logpath = /var/log/apache2/access.log, /var/log/apache2/*access.log
; never judged or banned
ignoreip = 127.0.0.0/8 ::1
; maxretry strikes within findtime seconds -> banned for bantime seconds
findtime = 600
maxretry = 3
bantime = 3600
; repeat offenders: bantime doubles per ban, up to maxtime
bantime.increment = 1
bantime.maxtime = 604800
; slow scanners: longretry probes (requests scoring rules_min_score or more) within longtime
; seconds ban, however far apart (0 = off)
longretry = 5
longtime = 86400
; scans spread over a subnet: once subnet_retry addresses of one /24 (IPv6 /64) have probed
; within findtime, those addresses and any other address of it that probes are banned. Only
; addresses that probed are banned, never the whole subnet (0 = off)
subnet_retry = 3
statefile = /var/lib/jevban/state.json
; also log here (a fail2ban filter can match its "Ban <ip>" lines)
logfile =
; prefilter: a request scoring this much goes to the decider (weights: 3 site-dependent, 6 probe, 10 attack)
suspicious_score = 3
; this many 4xx from one client within findtime is suspicious too (0 = off)
flood_4xx = 40
; this many different missing (404) paths within scan_window seconds is a path scan (+3: the
; decider judges it, with that context); 0 = off
scan_404 = 8
scan_window = 60
; extra rules, one per line: <weight> <url|request|agent|any> <tag> <regex>
signatures =
; known-bad paths (what scanners probe for): a 4xx on one is a probe (+6), a 2xx means it exists
; here (+3, the decider weighs it), and a 4xx within 1-2 edits of one is a variant (+3).
; Default: badpaths.txt next to the binary; off to disable
badpaths =
builtin_signatures = 1
; requests per client shown to the model as context
context_lines = 6
verbose = 0
; the daemon's scheduling niceness: the model may use every core, the web server comes first
; (Unix nice; on Windows any value > 0 means below-normal priority; 0 = off)
nice = 10

[decider]
; local: OpenJev runs inside jevban on llama.cpp (nothing else to install; the model downloads
;        on first start)
; jev:   ask a /v1/systemone server: the hosted Jev API or OpenJev's helper
; rules: signatures only, no model
mode = local

; --- mode = local ---
; flash-9b (Q4_K_M, 5.6 GB, default), flash-9b-q5 (6.5 GB), flash-9b-q6 (7.4 GB),
; flash-9b-q8 (9.5 GB), 27b (Q4_K_M, 16.5 GB), 27b-q5 (19.2 GB), 27b-q6 (22.1 GB),
; 27b-q8 (28.6 GB), or the path of a .gguf
local_model = flash-9b
; where models are kept (default /var/lib/jevban/models as root, ~/.cache/jevban/models otherwise,
; models\ next to jevban.exe on Windows)
model_dir =
; llama.cpp libraries (default: next to the binary, as the release ships them)
llama_lib_dir =
; CPU threads (0 = every core; the daemon runs at a lower priority, see nice)
threads = 0
; layers on the GPU; needs llama.cpp libraries built with a GPU backend (release builds are CPU)
gpu_layers = 0
; context per prompt, tokens
ctx = 8192
; readout calibration; empty = the model card's values (flash: 1.07 / 1.074766 / 0, 27b: 0.85 / 1.829074 / 0)
readout_t =
noul_t =
noul_bias =

; --- mode = jev ---
; a hosted decision API by name (sets mode = jev, url and model; the key from api_key, the provider's
; own variable, or JEV_API_KEY):
;   typesafe          https://api.typesafe.ai/v1/systemone          jev-latest           TYPESAFE_API_KEY
;   perplexity        https://api.perplexity.ai/v1/decisions        pplx-decider-latest  PERPLEXITY_API_KEY
;   perplexity-flash  https://api.perplexity.ai/v1/decisions        pplx-decider-flash-latest
;   liquid            https://api.liquid.ai/decisions/v1/systemone  d1.1                 LIQUID_API_KEY
;   digitalocean      https://inference.do-ai.run/v1/systemone      typesafe-jev-1.13.0  MODEL_ACCESS_KEY
;   abacus            https://routellm.abacus.ai/v1/systemone       jev-latest           ABACUS_API_KEY
;   vercel            https://ai-gateway.vercel.sh/typesafe/v1/systemone  typesafe-ai/jev AI_GATEWAY_API_KEY
; url and model below override the provider's
provider =
; any /v1/systemone server (empty: the provider's, else OpenJev's helper at
; http://127.0.0.1:3000/v1/systemone)
url =
; bearer token; or the provider's variable, or JEV_API_KEY
api_key =
model =
timeout_ms = 8000
; P(malicious) that counts as a strike / bans at once
threshold = 0.80
instant_threshold = 0.97
; flagged clients are queued and sent to the decider together, one question each, in ONE
; request: whenever the oldest has waited batch_interval seconds, or batch_lines log lines
; went by, or batch_clients clients are queued (whichever comes first).
; batch_interval = 0 and batch_clients = 1 ask about each client at once.
batch_interval = 5
batch_lines = 1000
batch_clients = 8
; also ask what each client is doing (vulnerability_scanner, exploit_attempt, ...): a second
; readout per client, shown in the log
ask_intent = 0
; reuse a client's verdict this long; only a pass is reused (a strike is always decided on the
; latest evidence)
cache_secs = 60
; ... and a pass this long while the client does nothing new: no signature it hasn't shown, and
; fewer new flagged requests than were judged (at least 3). An uptime monitor flagged for its
; curl user agent is asked once, not every five minutes
cache_pass_secs = 1800
; more requests than this per minute -> the rules decide
max_per_minute = 120
; decider unreachable: rules | skip
on_error = rules
rules_min_score = 6
rules_instant_score = 20
; hard rules: a request scoring this much (the weight-10 signatures: /.env, ../, ${jndi:,
; union select, sqlmap, ...) is a strike at once, without asking the model; 0 = the model decides all
override_score = 10
; a model p from here up to threshold is logged as REVIEW (no strike) for you to audit; 0 = off
review_threshold = 0.5
; 1 = ask the model and log its verdicts, but ban on the rules only: try the model on real traffic
; before letting it ban (compare with --eval on a labelled log)
shadow = 0
; tell the model what this server is; this is what makes "/wp-login.php" a probe or a normal login
site = A public web server. Judge requests against what a normal visitor or a well-behaved search engine would ask for.
;site = A static Hugo blog. It runs no PHP, no WordPress and no admin panel; any request for those is a probe.

[action]
; iptables | ipset (iptables with a hash set: use it for many bans) | nftables | ufw | firewalld |
; fail2ban | netsh | command | none
type = iptables
; chain / table name
name = jevban
port = 80,443
; for type = fail2ban
jail = jevban
; any of these replaces the preset's; tags: <ip> <v> <family> <fwfamily> <iptables> <name> <port> <jail> <bantime>
actionstart =
actionstop =
actionban =
actionunban =
dry_run = 0
; actionstop at exit (bans are restored from the state file at the next start)
cleanup_on_exit = 1
